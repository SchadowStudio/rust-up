name: Crypto payments branch tests

on:
  push:
    branches:
      - feature/self-hosted-crypto-payments
      - feature/rustup-payments-staging
      - feature/rustup-payment-admin-controls
    paths:
      - 'payments/**'
      - '.github/workflows/crypto-payments-checks.yml'
  pull_request:
    paths:
      - 'payments/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run same 0-euro offline suite as Windows
        run: cd payments && npm run test:local
      - name: Run isolated Telegram Stars and crypto checkout integration tests
        run: cd payments && node --test integration/telegram-stars/*.test.mjs
      - name: Verify private bot recovery and patch scripts
        run: |
          node --check payments/scripts/recover-live-bot-source.mjs
          node --check payments/scripts/patch-recovered-live-bot.mjs
          node --test payments/scripts/recover-live-bot-source.test.mjs
          node --check payments/scripts/prepare-live-bot-deployment.mjs
          node --test payments/scripts/prepare-live-bot-deployment.test.mjs
